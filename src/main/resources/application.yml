spring:
  datasource:
    url: jdbc:h2:mem:shuttle;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: availability
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5s
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
