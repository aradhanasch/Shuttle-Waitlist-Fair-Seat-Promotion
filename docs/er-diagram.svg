<rect x="470" y="90" width="380" height="306" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><rect x="470" y="90" width="380" height="30" rx="8" fill="#b91c1c"/><rect x="470" y="108" width="380" height="12" fill="#b91c1c"/><text x="660.0" y="111" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">booking</text><text x="480" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309">PK</text><text x="510" y="140" font-family="Consolas,monospace" font-size="12.5" fill="#111">id</text><text x="840" y="140" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">BIGINT</text><text x="480" y="162" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309">FK</text><text x="510" y="162" font-family="Consolas,monospace" font-size="12.5" fill="#111">trip_id</text><text x="840" y="162" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">-> trip.id</text><text x="480" y="184" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="510" y="184" font-family="Consolas,monospace" font-size="12.5" fill="#111">employee_id</text><text x="840" y="184" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">VARCHAR(50)</text><text x="480" y="206" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="510" y="206" font-family="Consolas,monospace" font-size="12.5" fill="#111">cost_centre</text><text x="840" y="206" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">VARCHAR(50)</text><text x="480" y="228" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309">CK</text><text x="510" y="228" font-family="Consolas,monospace" font-size="12.5" fill="#111">party_size</text><text x="840" y="228" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">INT  (>= 1)</text><text x="480" y="250" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="510" y="250" font-family="Consolas,monospace" font-size="12.5" fill="#111">state</text><text x="840" y="250" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">CONFIRMED|WAITLISTED|CANCELLED</text><text x="480" y="272" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309">UQ</text><text x="510" y="272" font-family="Consolas,monospace" font-size="12.5" fill="#111">request_seq</text><text x="840" y="272" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">BIGINT  (unique per trip)</text><text x="480" y="294" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="510" y="294" font-family="Consolas,monospace" font-size="12.5" fill="#111">requested_at</text><text x="840" y="294" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">TIMESTAMPTZ</text><text x="480" y="316" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="510" y="316" font-family="Consolas,monospace" font-size="12.5" fill="#111">tier</text><text x="840" y="316" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">INT</text><text x="480" y="338" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="510" y="338" font-family="Consolas,monospace" font-size="12.5" fill="#111">skip_count</text><text x="840" y="338" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">INT</text><text x="480" y="360" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="510" y="360" font-family="Consolas,monospace" font-size="12.5" fill="#111">checked_in_at</text><text x="840" y="360" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">TIMESTAMPTZ null</text><text x="480" y="382" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="510" y="382" font-family="Consolas,monospace" font-size="12.5" fill="#111">cancel_reason</text><text x="840" y="382" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">VARCHAR(30) null</text>
