" y="590" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="510" y="590" font-family="Consolas,monospace" font-size="12.5" fill="#111">created_at</text><text x="840" y="590" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">TIMESTAMPTZ</text>
