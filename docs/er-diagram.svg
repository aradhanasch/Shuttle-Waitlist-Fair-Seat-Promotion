<text x="20" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#0f172a">Shuttle Waitlist - ER Diagram</text>
<text x="20" y="50" font-family="Arial" font-size="12" fill="#475569">PK = primary key, FK = foreign key, UQ = unique, CK = check constraint. Dashed line = logical link (no DB foreign key).</text>
<rect x="40" y="90" width="330" height="196" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><rect x="40" y="90" width="330" height="30" rx="8" fill="#1d4ed8"/><rect x="40" y="108" width="330" height="12" fill="#1d4ed8"/><text x="205.0" y="111" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">trip</text><text x="50" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309">PK</text><text x="80" y="140" font-family="Consolas,monospace" font-size="12.5" fill="#111">id</text><text x="360" y="140" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">BIGINT</text><text x="50" y="162" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="80" y="162" font-family="Consolas,monospace" font-size="12.5" fill="#111">capacity</text><text x="360" y="162" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">INT</text><text x="50" y="184" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309">CK</text><text x="80" y="184" font-family="Consolas,monospace" font-size="12.5" fill="#111">seats_confirmed</text><text x="360" y="184" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">INT  (0..capacity)</text><text x="50" y="206" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="80" y="206" font-family="Consolas,monospace" font-size="12.5" fill="#111">next_request_seq</text><text x="360" y="206" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">BIGINT</text><text x="50" y="228" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="80" y="228" font-family="Consolas,monospace" font-size="12.5" fill="#111">check_in_cutoff</text><text x="360" y="228" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">TIMESTAMPTZ</text><text x="50" y="250" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="80" y="250" font-family="Consolas,monospace" font-size="12.5" fill="#111">no_show_processed</text><text x="360" y="250" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">BOOLEAN</text><text x="50" y="272" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309"></text><text x="80" y="272" font-family="Consolas,monospace" font-size="12.5" fill="#111">version</text><text x="360" y="272" text-anchor="end" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280">BIGINT (@Version)</text>
