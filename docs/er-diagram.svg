<rect x="900" y="90" width="590" height="190" rx="8" fill="#fffbeb" stroke="#d97706"/>
<text x="912" y="112" font-family="Arial" font-size="13" font-weight="bold" fill="#78350f">Design notes</text>
<text x="912" y="136" font-family="Arial" font-size="11"  fill="#78350f">- Every write takes SELECT ... FOR UPDATE on the trip row, so a trip is serialised.</text>
<text x="912" y="160" font-family="Arial" font-size="11"  fill="#78350f">- CHECK constraints are the last line of defence against over-booking.</text>
<text x="912" y="184" font-family="Arial" font-size="11"  fill="#78350f">- UNIQUE(trip_id, request_seq) guarantees a strict, tie-free FIFO order.</text>
<text x="912" y="208" font-family="Arial" font-size="11"  fill="#78350f">- Waitlist order = request_seq ASC, tier DESC, id ASC.</text>
<text x="912" y="232" font-family="Arial" font-size="11"  fill="#78350f">- A group is ONE booking row (party_size N), so it can never be split.</text>
<text x="912" y="256" font-family="Arial" font-size="11"  fill="#78350f">- Outbox row is written in the same transaction as the promotion.</text>
</svg>